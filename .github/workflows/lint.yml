name: Lint

# TEMPORARILY DISABLED (auto-trigger removed): app is mid-breakage and we're
# prioritizing getting it deployed. Manual trigger only via workflow_dispatch.
# Re-add `push`/`pull_request` once lint debt is cleared.
on: [workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit
      run: pre-commit run --all-files
